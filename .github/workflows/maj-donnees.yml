# Met à jour les données du site le 5 de chaque mois (et à la demande depuis l'onglet Actions).
name: Mise à jour des données

on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Télécharger les séries officielles
        run: uv run scripts/maj_donnees.py
      - name: Publier si les chiffres ont changé
        run: |
          if git diff --quiet -- data dette.png; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data dette.png
          git commit -m "Mise à jour automatique des données"
          git push
